version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: truthshield-backend
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_URL=http://localhost
      - FLASK_DEBUG=false
      - PORT=5000
      - MAX_CONTENT_LENGTH=104857600
      - CORS_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: truthshield-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
